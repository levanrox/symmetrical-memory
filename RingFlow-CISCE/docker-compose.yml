# RingFlow local services.
# Runs PostgreSQL directly on port 5432 for sub-millisecond local queries via Drizzle ORM.

services:
  db:
    image: postgres:16-alpine
    container_name: ringflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: event_suite
      POSTGRES_PASSWORD: event_suite
      POSTGRES_DB: ringflow
    ports:
      - "5432:5432"
    volumes:
      - ringflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_suite -d ringflow"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  ringflow-pgdata:
