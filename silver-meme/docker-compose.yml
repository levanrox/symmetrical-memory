# Postgres for local development and for the venue box.
#
#   docker compose up -d db      start it
#   docker compose down          stop it (data is kept in the named volume)
#   docker compose down -v       stop it and delete the data
#
# `infra/local-db-setup.sql` runs automatically the first time the volume is
# created, so the application role and the three databases exist without anyone
# having to remember a setup step.

services:
  db:
    image: postgres:16-alpine
    container_name: event-suite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # The setup script creates the real role and databases.
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - event-suite-db:/var/lib/postgresql/data
      - ./infra/local-db-setup.sql:/docker-entrypoint-initdb.d/10-local-db-setup.sql:ro
    healthcheck:
      # Checks the application database, not just that the server is up.
      test: ['CMD-SHELL', 'pg_isready -U event_suite -d event_suite']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  event-suite-db:
